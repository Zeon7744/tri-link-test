<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tri-Link Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .dashboard { max-width: 800px; margin: 0 auto; }
    h1 {
      font-size: 1.8em;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #58a6ff, #a371f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
    }
    .stat-value {
      font-size: 2.4em;
      font-weight: 700;
      color: #58a6ff;
    }
    .stat-label {
      color: #8b949e;
      font-size: 0.9em;
      margin-top: 8px;
    }
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .error { color: #f85149; }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
