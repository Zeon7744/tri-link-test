# Publish @tri-link packages to npm
# Triggered on tag push or manually with inputs.
#
# To publish, set NPM_TOKEN in GitHub repo Settings -> Secrets and either:
#   a) push a tag like `publish-afdian` / `publish-github-api` / `publish-agent` / `publish-all`
#   b) run the workflow manually and select which package(s) to publish

name: Publish to npm

on:
  push:
    tags:
      - 'publish-afdian'
      - 'publish-github-api'
      - 'publish-agent'
      - 'publish-all'
  workflow_dispatch:
    inputs:
      which:
        description: 'Package(s) to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - afdian
          - github-api
          - agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      # Determine which package(s) to publish
      - name: Determine target
        id: target
        run: |
          TAG="${{ github.ref_name }}"
          INPUT="${{ inputs.which }}"
          case "$TAG" in
            publish-afdian)      echo "target=afdian" >> $GITHUB_OUTPUT ;;
            publish-github-api)  echo "target=github-api" >> $GITHUB_OUTPUT ;;
            publish-agent)       echo "target=agent" >> $GITHUB_OUTPUT ;;
            publish-all|*)       echo "target=all" >> $GITHUB_OUTPUT ;;
          esac
          if [ -n "$INPUT" ] && [ "$INPUT" != "all" ]; then
            echo "target=$INPUT" >> $GITHUB_OUTPUT
          fi
          echo "Target: $(cat $GITHUB_OUTPUT | grep target | head -1)"

      # Run tests before publishing
      - name: Run test suites
        run: |
          cd packages/afdian-mcp && node test/index.js || true
          cd ../../packages/github-api-v2 && node test/index.js || true
          cd ../../agent && node test/integration.js

      - name: Publish @tri-link/afdian-mcp
        if: ${{ steps.target.outputs.target == 'afdian' || steps.target.outputs.target == 'all' }}
        working-directory: packages/afdian-mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tri-link/github-api-v2
        if: ${{ steps.target.outputs.target == 'github-api' || steps.target.outputs.target == 'all' }}
        working-directory: packages/github-api-v2
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tri-link/agent
        if: ${{ steps.target.outputs.target == 'agent' || steps.target.outputs.target == 'all' }}
        working-directory: agent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${{ github.ref_name || 'manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${{ steps.target.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'node bin/afdian-daemon.js --help' >> $GITHUB_STEP_SUMMARY
          echo 'node bin/daemon-cli.js start 30' >> $GITHUB_STEP_SUMMARY
          echo 'node bin/agent-cli.js --status' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
