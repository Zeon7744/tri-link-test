# 三端自动镜像：GitHub push → Gitee(SSH) + GitCode(token) 全自动
# 凭据走 GitHub Secrets：
#   GITEE_SSH_PRIVATE_KEY = 本仓专用 SSH 私钥（必须含完整 -----BEGIN/END OPENSSH PRIVATE KEY----- 边界行）
#   GITCODE_TOKEN         = GitCode PAT（仅用于 git push，不是 API 鉴权 token）
#
# 韧性设计（2026-10-24 v4）：
#   - Gitee / GitCode 拆成两个独立 job：一端失败不拖垮另一端
#   - concurrency group=mirror-triple-${{ github.ref }} cancel-in-progress=false：
#     dependabot 批量 push 时后到 run 排队等前一个跑完，避免并发 force push 竞争 ref lock
#   - fetch 失败不再静默吞掉：ref 陈旧会触发服务端 `cannot lock ref` 拒绝，必须 fail-fast
#   - bash 层重试循环（2 次）：CI 偶发网络抖动自动重试
#   - secret 缺失/格式错误时跳过本端镜像（warn + skip），不让单端 secret 损坏拖住 workflow
#   - secret 格式校验放宽到只查 OPENSSH 边界行（兼容旧式 BEGIN RSA PRIVATE KEY 格式）

name: mirror-triple

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: mirror-triple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GITEE_SSH_PRIVATE_KEY secret
        id: check_key
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$GITEE_SSH_PRIVATE_KEY" ]; then
            echo "::warning::GITEE_SSH_PRIVATE_KEY 未配置，跳过 Gitee 镜像（需白皇在 GitHub 仓库 Settings → Secrets 贴入完整私钥）"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 校验：必须含 BEGIN 和 END 边界行（兼容 OPENSSH / RSA / EC / PEM 各种格式）
          if ! grep -q "BEGIN" <<< "$GITEE_SSH_PRIVATE_KEY" || ! grep -q "END" <<< "$GITEE_SSH_PRIVATE_KEY"; then
            echo "::warning::GITEE_SSH_PRIVATE_KEY 缺 BEGIN/END 边界行（需贴入完整私钥全文），跳过 Gitee 镜像"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 打印 key 头 1 行用于诊断（脱敏：只显示首行）
          echo "key 首行: $(head -c 60 <<< "$GITEE_SSH_PRIVATE_KEY" | tr -d '\n')"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Mirror to Gitee (SSH, 2 retries)
        if: steps.check_key.outputs.skipped == 'false'
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          set -e
          REPO_NAME="tri-link-test"
          echo "$GITEE_SSH_PRIVATE_KEY" > /tmp/gitee_key
          chmod 600 /tmp/gitee_key
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i /tmp/gitee_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote add gitee "git@gitee.com:Zeon7744/${REPO_NAME}.git" 2>/dev/null || git remote set-url gitee "git@gitee.com:Zeon7744/${REPO_NAME}.git"
          for attempt in 1 2; do
            echo "--- Gitee mirror attempt $attempt ---"
            if git fetch gitee main && git push gitee main --force; then
              echo "✅ Gitee SSH synced on attempt $attempt: $(git rev-parse main)"
              exit 0
            fi
            echo "::warning::Gitee mirror attempt $attempt 失败，准备重试..."
            sleep 5
          done
          echo "::error::Gitee mirror 2 次尝试均失败"
          exit 1

      - name: Gitee skipped (secret missing/invalid)
        if: steps.check_key.outputs.skipped == 'true'
        run: |
          echo "## Gitee 镜像跳过" >> "$GITHUB_STEP_SUMMARY"
          echo "原因：GITEE_SSH_PRIVATE_KEY 未配置或格式错误。需在 GitHub 仓库 Settings → Secrets 贴入完整私钥全文（含 -----BEGIN/END----- 边界行）。" >> "$GITHUB_STEP_SUMMARY"

  mirror-gitcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GITCODE_TOKEN secret
        id: check_token
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "::warning::GITCODE_TOKEN 未配置，跳过 GitCode 镜像（需白皇在 GitHub 仓库 Settings → Secrets 贴入 GitCode PAT）"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Mirror to GitCode (token, 2 retries)
        if: steps.check_token.outputs.skipped == 'false'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          REPO_NAME="tri-link-test"
          GITCODE_TOKEN_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITCODE_TOKEN")
          git remote add gitcode "https://Zeon7744:${GITCODE_TOKEN_ENC}@gitcode.com/Zeon7744/${REPO_NAME}.git" 2>/dev/null || git remote set-url gitcode "https://Zeon7744:${GITCODE_TOKEN_ENC}@gitcode.com/Zeon7744/${REPO_NAME}.git"
          for attempt in 1 2; do
            echo "--- GitCode mirror attempt $attempt ---"
            if git fetch gitcode main && git push gitcode main --force; then
              echo "✅ GitCode synced on attempt $attempt: $(git rev-parse main)"
              exit 0
            fi
            echo "::warning::GitCode mirror attempt $attempt 失败，准备重试..."
            sleep 5
          done
          echo "::error::GitCode mirror 2 次尝试均失败"
          exit 1

      - name: GitCode skipped (secret missing)
        if: steps.check_token.outputs.skipped == 'true'
        run: |
          echo "## GitCode 镜像跳过" >> "$GITHUB_STEP_SUMMARY"
          echo "原因：GITCODE_TOKEN 未配置。需在 GitHub 仓库 Settings → Secrets 贴入 GitCode PAT。" >> "$GITHUB_STEP_SUMMARY"

  # 失败告警：任一镜像 job 失败时打 GITHUB_STEP_SUMMARY
  alert-on-failure:
    needs: [mirror-gitee, mirror-gitcode]
    if: |
      !cancelled() &&
      (needs.mirror-gitee.result == 'failure' || needs.mirror-gitcode.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## ⚠️ Mirror-triple 失败告警" >> "$GITHUB_STEP_SUMMARY"
          echo "某端同步失败，需人工排查（GitHub 侧正常，Gitee/GitCode 可能未同步）" >> "$GITHUB_STEP_SUMMARY"
          echo "触发 run: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "检查 Actions 日志确认哪一端失败后手动补推" >> "$GITHUB_STEP_SUMMARY"
